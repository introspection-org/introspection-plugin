name: Validate Agent Skills

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|deps|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits: <type>(optional-scope)!: <summary>"
            exit 1
          fi

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Validate reference resolution
        run: node scripts/validate-references.mjs

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install PyYAML
      - uses: actions/checkout@v7.0.1
        with:
          repository: openai/skills
          path: .skill-validator
      - name: Validate Agent Skills
        shell: bash
        run: |
          for skill in skills/*; do
            python .skill-validator/skills/.system/skill-creator/scripts/quick_validate.py "$skill"
          done
