name: Validate plugin

on:
  # `edited` matters: the PR title becomes the squash commit and drives the
  # release, so a title-only correction must be able to turn this check green.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|deps|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits: <type>(optional-scope)!: <summary>"
            exit 1
          fi

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Validate reference resolution
        run: node scripts/validate-references.mjs

  # The vendor's own conformance check. It tracks the plugin and marketplace
  # schemas as they evolve, which a third-party installer cannot.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      # Pointed at a directory the validator picks a single manifest, and the
      # marketplace one wins when both are present. Target each explicitly so
      # plugin.json is actually checked.
      - name: Validate marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./.claude-plugin/marketplace.json --strict
      - name: Validate plugin manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./.claude-plugin/plugin.json --strict
      - name: Check plugin.json agrees with its marketplace entry
        run: npx --yes @anthropic-ai/claude-code@latest plugin tag --dry-run
      - name: Check stable channel agrees with host manifests
        run: |
          node -e '
            const claude = require("./.claude-plugin/plugin.json");
            const codex = require("./.codex-plugin/plugin.json");
            const channel = require("./stable-channel.json");
            if (claude.version !== codex.version || claude.version !== channel.version) {
              throw new Error(`Version mismatch: Claude ${claude.version}, Codex ${codex.version}, channel ${channel.version}`);
            }
            if (channel.ref !== "stable") throw new Error(`Channel ref must be stable, got ${channel.ref}`);
          '

  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [codex, claude-code]
        # Users install with @latest, so validate against it as well as the
        # pinned version; an installer change should surface here first.
        installer: ["1.3.4", "latest"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Validate ${{ matrix.target }} discovery (plugins@${{ matrix.installer }})
        run: npx --yes plugins@${{ matrix.installer }} discover . --target "${{ matrix.target }}"
